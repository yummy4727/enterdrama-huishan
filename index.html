<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>回山试玩版</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div class="bg-wrap">
    <img id="bgA" class="bg show" alt="">
    <img id="bgB" class="bg" alt="">
    <div class="bg-fallback" id="bgFallback"></div>
  </div>

  <!-- 轻触首屏：唯一点击门（音频解锁在片 2 接入） -->
  <div id="tapGate">
    <div class="tap-seal"><span>轻触</span><span>开启剧情</span></div>
  </div>

  <!-- 播放控制条：自动播放 / 回到首页（回首页时被轻触首屏盖住并隐藏） -->
  <div id="playControls" class="hidden">
    <button id="btnAuto" type="button">自动播放</button>
    <button id="btnHome" type="button">回到首页</button>
  </div>

  <!-- 对话层 -->
  <div id="dialog" class="hidden">
    <div class="avatar-wrap hidden"><img id="avatar" alt=""></div>
    <div class="dialog-body">
      <div id="charName" class="char-name"></div>
      <div id="charText" class="char-text"></div>
    </div>
    <div class="click-hint" id="clickHint">轻触继续</div>
  </div>

  <!-- 选择层（朱砂印章按钮） -->
  <div id="choices" class="hidden"></div>

  <!-- 广告占位层：底部假 banner（片 6，自制假素材） -->
  <div id="adBanner" class="hidden">
    <img src="assets-src/fake-ads/banner.jpg" alt="广告">
    <span class="ad-badge">广告</span>
  </div>

  <!-- 结算层：播完 seq 368 定格后弹出（广告占位卡挂载点片 6 填充） -->
  <div id="endscreen" class="hidden">
    <div class="end-seal">待续</div>
    <div class="end-main">天亮之前，他得给个答案。</div>
    <div class="end-sub">可这段对话，停在了药膏擦上去的那一刻。</div>
    <div class="end-choices">
      <div class="end-choices-title">你的选择</div>
      <div id="endChoice1"></div>
      <div id="endChoice2"></div>
    </div>
    <a id="endCta" href="https://www.enterdrama.cn/" target="_blank" rel="noopener">去入戏 App 看结局</a>
    <div id="endAdSlot"></div>
    <button id="replay" type="button">重玩一次</button>
  </div>

  <!-- 激励视频假广告全屏层：点开 → 3 秒倒计时 → 关闭 → 回结算 -->
  <div id="adInterstitial" class="hidden">
    <img src="assets-src/fake-ads/rewarded.jpg" alt="广告">
    <div id="adiCount">3</div>
    <button id="adiClose" class="hidden" type="button" aria-label="关闭广告">✕</button>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
